name: Publish Tiny Aya demo

on:
  pull_request:
    paths: [demo/**, tools/publish_space.py, tools/space-files.txt, tests/test_publish_space.py, .github/workflows/huggingface-space.yml]
  push:
    branches: [main]
    paths: [demo/**, tools/publish_space.py, tools/space-files.txt, tests/test_publish_space.py, .github/workflows/huggingface-space.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            demo
            tools
            tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: node demo/check-render-contract.js
      - run: python -m pip install huggingface_hub==1.19.0 PyYAML==6.0.3
      - run: python tests/test_publish_space.py
      - run: python tools/publish_space.py

  deploy:
    if: github.repository == 'HyperGAN/tiny-aya-particle-sliders' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: huggingface-space-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tiny-aya-space-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            demo
            tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==1.19.0 PyYAML==6.0.3
      - name: Publish with the Space Trusted Publisher
        env:
          HF_OIDC_RESOURCE: spaces/ntc-ai/tiny-aya-particle-sliders
        run: |
          set -euo pipefail
          token="$(hf auth token)"
          case "$token" in
            hf_jwt_*) ;;
            *) echo 'Expected a short-lived Hugging Face repository token' >&2; exit 1 ;;
          esac
          echo "::add-mask::$token"
          HF_SPACE_WRITE_TOKEN="$token" python tools/publish_space.py --apply
