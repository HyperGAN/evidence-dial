name: Publish Tiny Aya artifacts

on:
  pull_request:
    paths:
      - releases/huggingface-*.json
      - tools/publish_hub_release.py
      - tests/test_hub_release.py
      - .github/workflows/huggingface-registry.yml
  push:
    branches: [main]
    paths:
      - releases/huggingface-*.json
      - tools/publish_hub_release.py
      - tests/test_hub_release.py
      - .github/workflows/huggingface-registry.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==1.19.0
      - run: python -m unittest discover -s tests -p test_hub_release.py
      - name: Check the publication matrix
        id: targets
        run: |
          set -euo pipefail
          matrix="$(python tools/publish_hub_release.py --matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify the proposed manifests
        if: github.event_name == 'pull_request'
        run: python tools/publish_hub_release.py --check-all

  publish:
    if: github.repository == 'HyperGAN/tiny-aya-particle-sliders' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: huggingface-registry-production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.verify.outputs.targets) }}
    concurrency:
      group: tiny-aya-hub-${{ matrix.resource }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==1.19.0
      - name: Publish reviewed Hub release
        env:
          HF_OIDC_RESOURCE: ${{ matrix.resource }}
          REPO_KIND: ${{ matrix.kind }}
          HUB_REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          token="$(hf auth token)"
          case "$token" in
            hf_jwt_*) ;;
            *) echo 'Expected a short-lived Hugging Face repository token' >&2; exit 1 ;;
          esac
          echo "::add-mask::$token"
          HF_TOKEN="$token" python tools/publish_hub_release.py "$REPO_KIND" --repo "$HUB_REPO" --apply
