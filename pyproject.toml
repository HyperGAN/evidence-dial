[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexica-evidence-dial"
version = "0.1.0"
description = "Learned grounding control for Tiny Aya, Lexsi hackathon 2026"
requires-python = ">=3.11"
dependencies = ["transformers==4.57.6", "torch>=2.6,<3", "huggingface-hub>=0.35,<1", "curatorkit==0.1.21", "auditkit==1.1.6", "safetensors>=0.7,<1", "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@63f6e3942340d8aadca816800d19fb1ac88d92a9#subdirectory=packages/particle-sliders-core"]

[project.optional-dependencies]
training = ["peft==0.18.0", "trl==0.25.1", "datasets==4.4.1", "accelerate==1.12.0", "pyarrow==21.0.0", "fsspec==2025.9.0", "dill==0.4.0", "multiprocess==0.70.18"]

[project.scripts]
evidence-dial = "evidence_dial.cli:main"

[project.entry-points."particle_sliders.response_backends"]
tiny-aya-evidence-dial = "evidence_dial.binding:BACKEND"
tiny-aya-evidence-dial-curated-v1 = "evidence_dial.curated_binding:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
tiny-aya-evidence-dial = "evidence_dial.binding:INFERENCE"
tiny-aya-evidence-dial-curated-v1 = "evidence_dial.curated_binding:INFERENCE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
